<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayyappan Manager | Pro Master</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(0,0,0,0.4);
            --card-bg: rgba(255, 255, 255, 0.03);
            --footer-bg: rgba(15, 23, 42, 0.8);
            --watermark-color: rgba(255, 255, 255, 0.02);
        }

        .light-mode {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --text-main: #1e293b;
            --text-dim: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(255, 255, 255, 0.9);
            --card-bg: rgba(0, 0, 0, 0.02);
            --footer-bg: rgba(241, 245, 249, 0.9);
            --watermark-color: rgba(0, 0, 0, 0.01);
        }

        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; font-family: 'Inter', sans-serif; transition: background 0.3s ease, color 0.3s ease; position: relative; overflow-x: hidden; }

        /* Fixed Watermark Issue */
        body::before {
            content: "AYYAPPAN PRO";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 12vw;
            font-weight: 900;
            color: var(--watermark-color);
            z-index: -1;
            pointer-events: none;
            white-space: nowrap;
        }

        .glass { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 1rem; }
        .input-box { background: var(--input-bg); border: 1px solid #475569; border-radius: 0.6rem; padding: 0.7rem; color: inherit; width: 100%; outline: none; font-size: 14px; }
        label { font-size: 11px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; display: block; letter-spacing: 0.5px; }
        .day-entry { background: var(--card-bg); border: 1px solid var(--glass-border); padding: 12px; border-radius: 12px; margin-bottom: 10px; position: relative; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .excel-table-container { overflow-x: auto; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass-bg); max-height: 500px; margin-bottom: 1.5rem; }
        .excel-table { width: 100%; border-collapse: collapse; font-size: 10.5px; white-space: nowrap; }
        .excel-table th { position: sticky; top: 0; background: #1e1b4b; padding: 12px 10px; text-align: left; text-transform: uppercase; color: var(--text-dim); border-bottom: 2px solid var(--glass-border); font-weight: 800; z-index: 10; }
        .light-mode .excel-table th { background: #e2e8f0; }
        .excel-table td { padding: 10px; border-bottom: 1px solid var(--glass-border); }

        .status-badge { padding: 2px 6px; border-radius: 4px; font-size: 8px; font-weight: 900; text-transform: uppercase; }
        .status-Received { background: #059669; color: white; }
        .status-Billed { background: #dc2626; color: white; }
        .status-NotBilled { background: #4b5563; color: white; }
    </style>
</head>
<body class="p-4">

    <div id="msgBox" class="hidden fixed top-5 left-1/2 -translate-x-1/2 bg-blue-600 text-white px-6 py-3 rounded-xl z-[200] shadow-2xl font-bold"></div>

    <div class="max-w-4xl mx-auto">
        <div id="kuralSection" class="glass p-5 rounded-2xl mb-6">
            <h3 id="kuralNumber" class="text-xs font-bold text-yellow-500 uppercase tracking-widest mb-2"></h3>
            <p id="kuralTamil" class="text-lg font-bold mb-3 leading-relaxed"></p>
            <p id="kuralMeaning" class="text-xs opacity-70 italic border-t border-white/10 pt-2"></p>
        </div>

        <div class="flex justify-between items-center mb-6">
            <h1 class="font-black text-2xl italic uppercase tracking-tighter text-blue-500">Ayyappan Pro <span class="text-white/40 font-normal text-xs not-italic lowercase">manager</span></h1>
            <div class="flex gap-3">
                <button onclick="toggleTheme()" class="w-10 h-10 glass flex items-center justify-center text-yellow-400"><i class="fas fa-moon"></i></button>
                <button onclick="toggleSettings()" class="w-10 h-10 glass flex items-center justify-center text-blue-400"><i class="fas fa-cog"></i></button>
            </div>
        </div>

        <div class="glass p-4 mb-6 border-l-4 border-yellow-500 shadow-lg max-w-md mx-auto">
            <div class="flex justify-between items-end mb-2">
                <label class="m-0 text-yellow-500 font-black">Target Progress</label>
                <span id="targetRem" class="text-xs font-bold">₹0</span>
            </div>
            <div class="w-full bg-black/10 h-3 rounded-full mb-2"><div id="targetBar" class="bg-yellow-500 h-full rounded-full" style="width:0%"></div></div>
            <div class="flex justify-between text-[10px] font-bold opacity-70"><span id="targetEarned">Earned: ₹0</span><span id="targetGoal">Target: ₹0</span></div>
        </div>

        <div class="glass p-5 mb-8 border-l-4 border-emerald-500 shadow-2xl max-w-md mx-auto">
            <h3 class="text-[10px] font-black text-emerald-500 uppercase tracking-widest mb-4"><i class="fas fa-search-dollar mr-2"></i>Payment Query</h3>
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label>Company</label>
                    <select id="queryCompany" onchange="runPaymentQuery()" class="input-box text-xs py-2"></select>
                </div>
                <div>
                    <label>Status</label>
                    <select id="queryStatus" onchange="runPaymentQuery()" class="input-box text-xs py-2">
                        <option value="All">All Status</option>
                        <option value="Received">Received</option>
                        <option value="Billed">Billed</option>
                        <option value="Not Billed">Not Billed</option>
                    </select>
                </div>
            </div>
            <div class="bg-black/20 p-4 rounded-xl border border-white/10 flex justify-between items-center">
                <div>
                    <div class="text-[9px] uppercase opacity-60 font-bold">Calculated Amount</div>
                    <div id="queryTotalResult" class="text-xl font-black text-emerald-400">₹0</div>
                </div>
                <div class="text-right">
                    <div class="text-[9px] uppercase opacity-60 font-bold">Records</div>
                    <div id="queryCountResult" class="text-lg font-bold">0</div>
                </div>
            </div>
        </div>

        <div class="glass p-5 mb-8 space-y-5 border-t-4 border-blue-600 shadow-2xl max-w-md mx-auto">
            <input type="hidden" id="editId">
            <div class="grid grid-cols-2 gap-4">
                <div><label>Work Date</label><input type="date" id="date" class="input-box"></div>
                <div><label>Quotation No</label><input type="text" id="qn" class="input-box" placeholder="QN-XXXX"></div>
            </div>
            <div class="grid grid-cols-2 gap-3 bg-black/10 p-3 rounded-xl">
                <div class="flex items-center gap-2"><input type="checkbox" id="isHoliday" onchange="checkHoliday()" class="w-5 h-5"><label class="m-0 text-red-500">Holiday</label></div>
                <select id="projectType" class="bg-transparent text-xs font-black text-blue-500 uppercase outline-none"><option value="Solo">Solo Work</option><option value="Partner">Partner Work</option></select>
            </div>
            
            <div id="workFields" class="space-y-5">
                <div><label>Company</label><select id="company" class="input-box"></select></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label>Customer Name *</label><input type="text" id="customer" class="input-box"></div>
                    <div><label>Site Location</label><input type="text" id="location" class="input-box"></div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div><label>Windows Qty</label><input type="number" id="windowQty" class="input-box"></div>
                    <div><label>Total Sqft</label><input type="number" id="totalSqft" oninput="calculate()" class="input-box"></div>
                    <div><label>Rate / Sqft</label><input type="number" id="amtRate" oninput="calculate()" class="input-box"></div>
                </div>

                <div class="flex justify-between items-center p-4 bg-black/5 rounded-2xl border border-white/10">
                    <div><label class="m-0 text-green-500">Gross Bill</label><div id="resTotal" class="text-xl font-black text-green-500">₹0</div></div>
                    <div class="text-right"><label class="m-0 text-red-500">Total Wages</label><div id="resExpDisplay" class="text-lg font-bold text-red-500">₹0</div></div>
                </div>
            </div>

            <div id="holidayReasonDiv" class="hidden"><label>Holiday Remark *</label><textarea id="holidayReason" class="input-box h-16"></textarea></div>

            <div class="p-3 bg-white/5 rounded-xl border border-white/10">
                <label>Payment Status</label>
                <div class="flex gap-2">
                    <button onclick="setPaymentStatus('Received')" id="btnReceived" class="flex-1 py-2 rounded-lg text-[10px] font-black uppercase border border-white/10 opacity-40">Received</button>
                    <button onclick="setPaymentStatus('Billed')" id="btnBilled" class="flex-1 py-2 rounded-lg text-[10px] font-black uppercase border border-white/10 opacity-40">Billed</button>
                    <button onclick="setPaymentStatus('Not Billed')" id="btnNotBilled" class="flex-1 py-2 rounded-lg text-[10px] font-black uppercase border border-white/10 opacity-40">Not Billed</button>
                    <input type="hidden" id="paymentStatus" value="Billed">
                </div>
            </div>
            
            <button onclick="saveData()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg active:scale-95 transition-transform">Save Record</button>
        </div>

        <div class="flex justify-between items-center mb-4 px-1">
            <h3 class="text-sm font-black uppercase text-blue-500">Site History</h3>
            <span id="recordCount" class="text-[9px] font-bold opacity-40 uppercase"></span>
        </div>
        <div class="excel-table-container">
            <table class="excel-table">
                <thead>
                    <tr><th>Date</th><th>QN</th><th>Company</th><th>Customer</th><th>Location</th><th>Bill</th><th>Status</th><th>Net</th><th>Action</th></tr>
                </thead>
                <tbody id="historyTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="glass p-5 w-full max-w-md space-y-4">
            <h2 class="text-sm font-black text-blue-400 uppercase tracking-widest">Global Settings</h2>
            <div><label>Monthly Goal (₹)</label><input type="number" id="setTarget" class="input-box"></div>
            <div><label>Registered Companies (Comma separated)</label><textarea id="setCompanies" class="input-box h-20 text-xs"></textarea></div>
            <button onclick="saveSettings()" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white uppercase">Update & Sync</button>
            <button onclick="toggleSettings()" class="w-full text-xs font-bold opacity-50">Close</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcdPfK_Y4sUb2O0jqT2-6O3iN1R2_jG58", authDomain: "ayyappan-work-management.firebaseapp.com", projectId: "ayyappan-work-management" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let allEntries = [];
        let globalSettings = { target: 50000, companies: "Sharp, Buildcon" };

        function runPaymentQuery() {
            const comp = document.getElementById('queryCompany').value;
            const stat = document.getElementById('queryStatus').value;
            let total = 0, count = 0;

            allEntries.forEach(d => {
                const matchComp = (comp === "All" || d.company === comp);
                const matchStat = (stat === "All" || d.paymentStatus === stat);
                if (matchComp && matchStat && !d.isHoliday) {
                    total += (parseFloat(d.total) || 0);
                    count++;
                }
            });

            document.getElementById('queryTotalResult').innerText = "₹" + Math.round(total).toLocaleString();
            document.getElementById('queryCountResult').innerText = count;
        }

        function setPaymentStatus(status) {
            document.getElementById('paymentStatus').value = status;
            ['Received', 'Billed', 'Not Billed'].forEach(s => {
                const btn = document.getElementById(`btn${s.replace(' ', '')}`);
                btn.classList.add('opacity-40'); btn.style.backgroundColor = 'transparent';
                if (s === status) {
                    btn.classList.remove('opacity-40');
                    btn.style.backgroundColor = s === 'Received' ? '#059669' : (s === 'Billed' ? '#dc2626' : '#4b5563');
                    btn.style.color = 'white';
                }
            });
        }

        async function syncSettings() {
            const doc = await db.collection("appSettings").doc("userConfig").get();
            if(doc.exists) {
                globalSettings = doc.data();
                document.getElementById('setTarget').value = globalSettings.target;
                document.getElementById('setCompanies').value = globalSettings.companies;
            }
            loadDropdowns();
        }

        function loadDropdowns() {
            const comps = (globalSettings.companies || "").split(',');
            const options = comps.map(c => `<option value="${c.trim()}">${c.trim()}</option>`).join('');
            document.getElementById('company').innerHTML = options;
            document.getElementById('queryCompany').innerHTML = `<option value="All">All Companies</option>` + options;
        }

        function calculate() {
            const val = (parseFloat(document.getElementById('totalSqft').value) || 0) * (parseFloat(document.getElementById('amtRate').value) || 0);
            document.getElementById('resTotal').innerText = "₹" + Math.round(val).toLocaleString();
            return val;
        }

        async function saveData() {
            const data = {
                date: document.getElementById('date').value,
                qn: document.getElementById('qn').value,
                company: document.getElementById('company').value,
                customer: document.getElementById('customer').value,
                location: document.getElementById('location').value,
                total: calculate(),
                paymentStatus: document.getElementById('paymentStatus').value,
                isHoliday: document.getElementById('isHoliday').checked,
                projectType: document.getElementById('projectType').value,
                totalSqft: document.getElementById('totalSqft').value,
                amtRate: document.getElementById('amtRate').value
            };
            const id = document.getElementById('editId').value;
            if(id) await db.collection("workLogs").doc(id).update(data);
            else await db.collection("workLogs").add(data);
            location.reload();
        }

        db.collection("workLogs").orderBy("date", "desc").onSnapshot(snap => {
            allEntries = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderTable();
            runPaymentQuery();
        });

        function renderTable() {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = "";
            allEntries.forEach(d => {
                const row = document.createElement('tr');
                const sClass = `status-${(d.paymentStatus || 'Billed').replace(' ', '')}`;
                row.innerHTML = `
                    <td>${d.date}</td><td>${d.qn || '-'}</td><td>${d.company}</td><td>${d.customer}</td><td>${d.location}</td>
                    <td>₹${Math.round(d.total || 0).toLocaleString()}</td>
                    <td><span class="status-badge ${sClass}">${d.paymentStatus || 'Billed'}</span></td>
                    <td>₹${Math.round(d.total || 0).toLocaleString()}</td>
                    <td><button onclick="deleteDoc('${d.id}')" class="text-red-500"><i class="fas fa-trash"></i></button></td>`;
                tbody.appendChild(row);
            });
        }

        function toggleSettings() { const m = document.getElementById('settingsModal'); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }
        async function saveSettings() {
            globalSettings = { target: document.getElementById('setTarget').value, companies: document.getElementById('setCompanies').value };
            await db.collection("appSettings").doc("userConfig").set(globalSettings);
            location.reload();
        }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        async function deleteDoc(id) { if(confirm("Delete?")) await db.collection("workLogs").doc(id).delete(); }

        window.onload = () => { syncSettings(); };
    </script>
</body>
</html>
